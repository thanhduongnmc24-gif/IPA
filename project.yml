name: GhiChu
options:
  bundleIdPrefix: vn.io.duongnt
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  GhiChu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MaNguon
      - path: TaiNguyen
        excludes:
          - ThongTin.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: Ghichu.duongnt.io.vn
        PRODUCT_NAME: GhiChu
        INFOPLIST_FILE: TaiNguyen/ThongTin.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 2.1.4
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  GhiChu:
    build:
      targets:
        GhiChu: all
    run:
      config: Debug
    archive:
      config: Release
